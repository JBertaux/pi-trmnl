[package]
name = "pi-trmnl"
version = "1.0.0"
edition = "2024"
authors = ["Jérôme Bertaux"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
